<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0d" />
  <meta name="description" content="Second Nature is an interactive laboratory for exploring and changing what comes naturally to you." />
  <title>Second Nature — A laboratory for the mind</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/material.css" />
</head>
<body>
  <canvas id="particle-field" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>
  <div id="app" class="app">
    <header class="header">
      <button type="button" class="brand" id="brand" aria-label="Second Nature, replay introduction">second<span class="brand-gold">nature</span><span class="brand-dot">.</span></button>
      <button type="button" class="lab-button" id="lab-button" aria-label="Open your laboratory history"><span class="lab-indicator"></span><span>YOUR LAB</span><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M5 10h10m-5-5 5 5-5 5" /></svg></button>
    </header>

    <section class="stage" aria-live="polite">
      <div class="top-caption"><span id="mode-id">01 / CONDITION</span><span id="progress-caption">YOUR MIND IS THE LAB</span></div>
      <button type="button" id="field-touch" class="field-touch" aria-label="Explore the particle field"><span class="field-touch-label" id="field-touch-label"></span></button>
      <div class="stage-content" id="stage-content">
        <div class="section-kicker" id="mode-kicker">TRAIN A RESPONSE</div>
        <h1 id="mode-title">Condition<span class="title-period">.</span></h1>
        <p id="mode-copy">Choose a cue. Practice a response.<br />Make something new feel familiar.</p>
        <button type="button" id="mode-action" class="action"><span id="action-label">Begin a practice</span><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M3.5 10h12m-5-5 5 5-5 5" /></svg></button>
        <button type="button" id="mode-extra" class="secondary-link">Explore your pairings <span aria-hidden="true">↗</span></button>
      </div>
    </section>
    <nav class="mode-nav" aria-label="Modes">
      <button type="button" data-mode="0" class="mode-tab active" aria-current="page"><span class="tab-dot" aria-hidden="true"></span><span>Condition</span></button>
      <button type="button" data-mode="1" class="mode-tab"><span class="tab-dot" aria-hidden="true"></span><span>Shift</span></button>
      <button type="button" data-mode="2" class="mode-tab"><span class="tab-dot" aria-hidden="true"></span><span>Discover</span></button>
    </nav>
    <div class="footer-note"><span>NOTICE</span><span class="footer-line"></span><span>PRACTICE</span><span class="footer-line"></span><span>CHANGE</span></div>
  </div>

  <div id="introduction" class="intro hidden" role="dialog" aria-modal="true" aria-labelledby="intro-phrase">
    <div class="intro-top"><span>SECOND NATURE</span><button id="intro-skip" type="button" class="bare-button">SKIP INTRO <span aria-hidden="true">↗</span></button></div>
    <div class="intro-middle"><p class="intro-index" id="intro-index">AN EXPERIMENT IN BECOMING</p><h2 id="intro-phrase">Your mind learns<br/>from what you notice.</h2><div class="intro-subline" id="intro-subline">A LABORATORY FOR THE MIND</div></div>
    <div class="intro-bottom"><span id="intro-counter">01 — 03</span><div class="intro-progress" aria-hidden="true"><span id="intro-progress-inner"></span></div><button type="button" class="intro-enter" id="intro-enter">ENTER THE LAB <span aria-hidden="true">→</span></button></div>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop hidden">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-top"><div class="sheet-kicker" id="sheet-kicker">YOUR EXPERIMENT</div><button type="button" class="sheet-close" id="sheet-close" aria-label="Close panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
      <h2 id="sheet-title"></h2><div id="sheet-body"></div>
    </section>
  </div>
  <noscript><div class="noscript">Second Nature requires JavaScript to run the interactive laboratory.</div></noscript>
  <script src="/particles.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/material.js" defer></script>
</body>
</html>
